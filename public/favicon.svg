<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="50%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#04060c"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#neonGrad)" stroke-width="12"/>
  
  <!-- Subtle Grid lines -->
  <path d="M24 160 H488 M24 256 H488 M24 352 H488 M160 24 V488 M256 24 V488 M352 24 V488" stroke="#00f5ff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Glowing Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#neonGrad)" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="16 12"/>

  <!-- Stylized Monogram "MS" -->
  <!-- "M" Geometry -->
  <path d="M120 340 V172 L188 276 L256 172 V340" fill="none" stroke="url(#neonGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- "S" Geometry -->
  <path d="M380 200 C380 172 356 160 324 160 C284 160 272 188 272 216 C272 264 380 252 380 300 C380 340 348 352 320 352 C280 352 264 328 264 300" fill="none" stroke="url(#glowGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Cybernetic accent nodes -->
  <circle cx="256" cy="172" r="8" fill="#00f5ff" filter="url(#glow)"/>
  <circle cx="120" cy="172" r="8" fill="#38bdf8"/>
  <circle cx="380" cy="200" r="8" fill="#ec4899"/>
</svg>
